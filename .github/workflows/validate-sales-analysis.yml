name: Validate sales analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify deterministic dataset generation
        run: |
          python python/generate_sales_data.py
          git diff --exit-code -- datasets/sales_data.csv

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sales analysis
        run: python python/analyze_sales.py
